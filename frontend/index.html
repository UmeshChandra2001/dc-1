<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cycle Loading Page</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            font-family: Arial, sans-serif;
            color: white;
        }

        .container {
            text-align: center;
        }

        .loader {
            width: 80px;
            height: 80px;
            border: 8px solid rgba(255,255,255,.3);
            border-top: 8px solid #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: auto;
        }

        h1 {
            margin-top: 20px;
            font-size: 28px;
        }

        p {
            font-size: 16px;
            opacity: 0.9;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .status {
            margin-top: 15px;
            font-weight: bold;
            color: #ffd700;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="loader"></div>
    <h1>Application Running</h1>
    <p>Welcome to Umesh Demo Application</p>
    <div class="status">Container Status: Healthy ✅</div>
</div>

</body>
</html>
